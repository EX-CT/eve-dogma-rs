[package]
name = "eve-dogma"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Stateless, deterministic EVE Online fitting engine (dogma) with CLI and JSONL RPC"
repository = "https://github.com/EX-CT/eve-dogma-rs"

[dependencies]
flate2 = "1.1.10"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
